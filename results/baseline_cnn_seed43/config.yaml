seed: 43
data:
  splits_dir: data/splits
  image_size: 224
  num_workers: 2
  cache_images: true
augmentation:
  rotation_degrees: 10
  translate: 0.1
  scale:
  - 0.9
  - 1.1
  brightness: 0.1
  contrast: 0.1
  horizontal_flip: false
training:
  batch_size: 32
  epochs: 25
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 1
  class_balancing: weighted_sampler
  amp: true
  early_stopping_metric: roc_auc
  early_stopping_patience: 5
evaluation:
  threshold: 0.5
  inference_warmup: 10
model:
  name: baseline_cnn
  pretrained: true
debug:
  images_per_class: 16
  epochs: 1
  batch_size: 8
debug_run: false
environment:
  device: cuda
  gpu: Tesla T4
  python: 3.13.15
  torch: 2.11.0+cu128
  timm: 1.0.29
